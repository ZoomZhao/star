apply plugin: 'com.android.application'

android {
    namespace 'com.starexplorer.app'
    compileSdk 36
    defaultConfig {
        applicationId project.hasProperty('isolatedTestApp') ? 'com.starexplorer.app.testbed' : 'com.starexplorer.app'
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName '0.2.4-native'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'API_BASE_URL', '"https://star.zoomzhao.com"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { assets.exclude '**/public/**', '**/capacitor*' } }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
